<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>访问验证 · zcode-webui</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         background: #111418; color: #e8eaed; font: 14px/1.6 system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
  main { width: min(360px, 90vw); padding: 28px 26px; border-radius: 14px; background: #1a1e23;
         border: 1px solid #2c3138; box-shadow: 0 24px 64px rgba(0,0,0,.5); }
  h1 { margin: 0 0 6px; font-size: 17px; font-weight: 600; }
  p { margin: 0 0 18px; color: #9aa3ad; font-size: 13px; }
  form { display: flex; gap: 8px; }
  input { flex: 1; min-width: 0; background: #14171b; color: #e8eaed; border: 1px solid #2c3138;
          border-radius: 8px; padding: 9px 11px; font: inherit; }
  input:focus { outline: none; border-color: #2f6fed; }
  button { background: #2f6fed; color: #fff; border: 0; border-radius: 8px; padding: 9px 16px;
           font: inherit; cursor: pointer; }
  button:hover { background: #275fd0; }
  #msg { min-height: 20px; margin-top: 10px; color: #ffb4ab; font-size: 12px; }
</style>
</head>
<body>
<main>
  <h1>zcode-webui</h1>
  <p>此服务启用了访问令牌。输入令牌后继续；令牌由服务端 config.json 的 accessToken（或 ZCODE_WEBUI_ACCESS_TOKEN）配置。</p>
  <form id="f">
    <input id="t" type="password" placeholder="访问令牌" autocomplete="current-password" autofocus />
    <button type="submit">继续</button>
  </form>
  <div id="msg"></div>
</main>
<script>
(function () {
  'use strict';
  // The gate page is served IN PLACE at whatever URL was requested (so it works
  // behind prefix-stripping proxies), hence the relative fetch and the reload
  // after the cookie lands — both resolve against the original page URL.
  document.getElementById('f').addEventListener('submit', function (ev) {
    ev.preventDefault();
    var msg = document.getElementById('msg');
    msg.textContent = '';
    fetch('api/access', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token: document.getElementById('t').value })
    })
      .then(function (r) {
        return r.json().then(function (j) { return { ok: r.ok && j.ok }; });
      })
      .then(function (r) {
        if (r.ok) { window.location.reload(); }
        else { msg.textContent = '令牌不正确，请重试。'; }
      })
      .catch(function () { msg.textContent = '请求失败，请检查网络后重试。'; });
  });
})();
</script>
</body>
</html>
